name: cibo-drive-prod

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  web:
    <<: *runtime
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    environment:
      SITE_ADDRESS: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      GOMEMLIMIT: 42MiB
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}

  api:
    <<: *runtime
    image: ${API_IMAGE:?Set API_IMAGE}
    mem_limit: 232m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=112
      CIBO_API_HOST: 0.0.0.0
      CIBO_WEB_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      CIBO_MASTER_GOOGLE_SUB: ${CIBO_MASTER_GOOGLE_SUB:?Set CIBO_MASTER_GOOGLE_SUB}
      S3_ENDPOINT: http://objects:8333
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  objects:
    <<: *runtime
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command: ["mini","-dir=/data"]
    mem_limit: 352m
    environment:
      GOMEMLIMIT: 240MiB
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    volumes:
      - type: bind
        source: ${OBJECT_DATA_DIR:?Set OBJECT_DATA_DIR}
        target: /data
        bind: {create_host_path: false}
volumes:
  certificates:
  caddy_config:
