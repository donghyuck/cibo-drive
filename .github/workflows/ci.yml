name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 -m venv apps/api/extraction/.venv && apps/api/extraction/.venv/bin/pip install -r apps/api/extraction/requirements.txt
      - run: apps/api/extraction/.venv/bin/python apps/api/extraction/test_extract.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Start development storage
        run: |
          cp .env.example .env
          docker compose up -d --wait
          for attempt in {1..20}; do
            if npm run infra:check; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:drive
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
