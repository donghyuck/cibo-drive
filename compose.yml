services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: cibo
      POSTGRES_USER: cibo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cibo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cibo -d cibo"]
      interval: 5s
      timeout: 3s
      retries: 15
  objects:
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Copy .env.example to .env first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Copy .env.example to .env first}
      S3_BUCKET: ${S3_BUCKET:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - cibo-objects:/data
volumes:
  cibo-db:
  cibo-objects:
